services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campuslife
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campuslife"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
